name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      URLLIB3_NO_OVERRIDE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Run lint checks
        run: uv run --locked --extra dev poe lint

      - name: Check formatting
        run: uv run --locked --extra dev poe format-check

      - name: Run type checks
        run: uv run --locked --extra dev poe typecheck

      - name: Run tests
        run: uv run --locked --extra dev pytest
        env:
          QT_QPA_PLATFORM: offscreen

  # Qt is the optional `gui` extra, and the command line has to install and
  # run without it. No Qt system libraries are installed here either, so a
  # command line import that reaches for Qt fails this job.
  without-qt:
    runs-on: ubuntu-latest
    env:
      URLLIB3_NO_OVERRIDE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install development dependencies, then remove Qt
        run: |
          uv sync --locked --extra dev
          uv pip uninstall pyside6-essentials shiboken6 qtawesome qtpy

      - name: Run the tests that do not need Qt
        run: uv run --no-sync pytest

      - name: Start the command line
        run: uv run --no-sync nfoforge --help
