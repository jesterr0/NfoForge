[tracker.beyond_hd]
upload_enabled = true
announce_url = ""
enabled = false
source = "BHD"
comments = ""
nfo_template = ""
url_type = 1
column_s = 1
column_space = 1
row_space = 0
mvr_title_override_enabled = true
# BeyondHD rule 3.1.1 is order-free: "Movie Name / Movie Year / Edition /
# Relevant Information / Group Tag". Rule 3.3.9 is the one hard requirement --
# a remux, encode or web-dl with no release group must end in "-NOGROUP"
# (not NoGroup, NOGRP or NOTAG), which is what `default('NOGROUP')` supplies.
# BeyondHD's policy is FREE, so this is a starting point a user can edit,
# not an enforced format.
mvr_title_token_override = "{title_exact} {release_year} {cut} {frame_size} {hybrid} {re_release} {resolution}{:opt= :streaming_service} {source}{:opt= :remux}{:opt= :audio_codec_no_atmos}{:opt= :audio_channel_s}{:opt= :atmos}{:opt= :video_dynamic_range_type}{:opt= :video_codec}{:opt=-:release_group|default('NOGROUP')}"
mvr_title_replace_map = [
    [
        '''(?<=\s)DDP(?=\s\d)''',
        "DD+",
    ],
    [
        '''(?i)hdr10plus''',
        "HDR10+",
    ],
    [
        '''\bHYBRID\b''',
        "Hybrid",
    ],
]
mvr_title_colon_replace = 1
anonymous = false
api_key = ""
rss_key = ""
promo = 0
live_release = 1
internal = false
image_width = 350
add_localization_to_custom_edition = false
stream_optimized = false

# Rule 3.2.1: "Series Name / Series Year / Season Number(+Episode Number for
# Single Episodes) / Edition / Relevant Information / Group Tag". No episode
# title is called for, so none is emitted.
[tracker.beyond_hd.tvr_title_overrides.standard]
enabled = true
colon_replace = 1
token = "{title_exact} S{season_number|zfill(2)}{:opt=E:episode_number|zfill(2)} {cut} {frame_size} {hybrid} {re_release} {resolution}{:opt= :streaming_service} {source}{:opt= :remux}{:opt= :audio_codec_no_atmos}{:opt= :audio_channel_s}{:opt= :atmos}{:opt= :video_dynamic_range_type}{:opt= :video_codec}{:opt=-:release_group|default('NOGROUP')}"
replace_map = [
