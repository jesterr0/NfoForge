[tracker.aither]
upload_enabled = true
announce_url = ""
enabled = false
source = "Aither"
comments = ""
nfo_template = ""
url_type = 1
column_s = 1
column_space = 1
row_space = 0
mvr_title_override_enabled = true
# Aither publishes a different component order per release type. Encodes and
# web releases run "... Source AudioCodec Channels Metadata HDR VideoCodec";
# remuxes run "... Source REMUX HDR VideoCodec AudioCodec Channels Metadata".
# Both orders are written out here and the `only_if`/`unless` filters emit the
# one that fits the release. Everything else follows Aither's component table:
# HDR is omitted for SDR (so `{video_dynamic_range_type}`, not the
# `_inc_sdr_over_1080` variant), Cut precedes Ratio, and an untagged release
# gets no tag rather than a "NOGROUP" placeholder.
mvr_title_token_override = "{title_exact} {release_year} {cut} {frame_size} {hybrid} {re_release} {resolution}{:opt= :streaming_service} {source}{:opt= :remux}{:opt= :video_dynamic_range_type|only_if(remux)}{:opt= :video_codec|only_if(remux)}{:opt= :audio_codec_no_atmos}{:opt= :audio_channel_s}{:opt= :atmos}{:opt= :video_dynamic_range_type|unless(remux)}{:opt= :video_codec|unless(remux)}{:opt=-:release_group}"
mvr_title_replace_map = [
    [
        '''(?<=\s)DDP(?=\s\d)''',
        "DD+",
    ],
    [
        '''(?i)hdr10plus''',
        "HDR10+",
    ],
    [
        '''\bHYBRID\b''',
        "Hybrid",
    ],
]
mvr_title_colon_replace = 1
api_key = ""
anonymous = false
internal = false
personal_release = false
stream_optimized = false
opt_in_to_mod_queue = false
featured = false
free = false
double_up = false
sticky = false
image_width = 350

