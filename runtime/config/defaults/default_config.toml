# ReelFliX rule 4.1 states the elements may appear in any order as long as
# every required one is present, so this needs no source-dependent ordering --
# unlike Aither and LST below. Rule 4.1 also prefers an absent tag over a
# "NOGROUP" placeholder, which `{:opt=-:release_group}` gives for free.
