[torrent_client]

[torrent_client.qbittorrent]
enabled = false
# Loopback default -- fine for a local client. If this is pointed at a
# remote host, use "https://" or the WebUI password will be sent in
# cleartext.
host = "http://127.0.0.1"
port = 0
user = ""
password = ""
specific_params = { "category" = "", "super_seeding" = false, "save_path_mode" = "Client default", "save_path_template" = "" }

[torrent_client.deluge]
enabled = false
# Loopback default -- fine for a local client. If this is pointed at a
# remote host, use "https://" or the WebUI password will be sent in
# cleartext.
host = "http://127.0.0.1"
port = 0
user = ""
password = ""
specific_params = { "label" = "", "path" = "" }

[torrent_client.rtorrent]
enabled = false
host = "https://<user>:<password>@www.url.com/plugins/httprpc/action.php"
port = 0
user = ""
password = ""
specific_params = { "label" = "", "path" = "", "verify_tls" = true, "ca_bundle" = "" }

[torrent_client.transmission]
enabled = false
# Loopback default -- fine for a local client. The user/password below are
# embedded in this URI; if it is pointed at a remote host, use "https://"
# or those credentials will be sent in cleartext.
host = "http://<user>:<password>@127.0.0.1/transmission/rpc"
port = 0
user = ""
password = ""
specific_params = { "label" = "", "path" = "" }

