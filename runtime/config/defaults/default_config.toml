# LST publishes two templates. Full discs and remuxes run
# "... SOURCE TYPE Hi10P HDR Vcodec Dub Acodec Channels Object"; encodes, WEB-DLs,
# WEBRips and HDTV run "... SOURCE TYPE Dub Acodec Channels Object Hi10P HDR Vcodec".
# Both orders are written out here and the `only_if`/`unless` filters emit the
# one that fits the release. LST also declares Cut before Ratio, and omits HDR
# entirely for SDR sources -- hence `{video_dynamic_range_type}` rather than the
# `_inc_sdr_over_1080` variant, which prints "SDR" at 2160p.
mvr_title_token_override = "{title_exact} {release_year} {cut} {frame_size} {hybrid} {re_release} {resolution}{:opt= :streaming_service} {source}{:opt= :remux}{:opt= :video_dynamic_range_type|only_if(remux)}{:opt= :video_codec|only_if(remux)}{:opt= :audio_codec_no_atmos}{:opt= :audio_channel_s}{:opt= :atmos}{:opt= :video_dynamic_range_type|unless(remux)}{:opt= :video_codec|unless(remux)}{:opt=-:release_group}"
mvr_title_replace_map = [
    [
        '''(?<=\s)DDP(?=\s\d)''',
        "DD+",
    ],
    [
        '''(?i)hdr10plus''',
        "HDR10+",
    ],
    [
        '''\bHYBRID\b''',
        "Hybrid",
    ],
]
mvr_title_colon_replace = 1
api_key = ""
anonymous = false
internal = false
personal_release = false
mod_queue_opt_in = false
draft_queue_opt_in = false
featured = false
free = 0
double_up = false
sticky = false
