[project]
name = "NfoForge"
version = "1.1.7"
description = "NFO generator and upload assistant"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flatbencode",
    "pymediainfo>=7.0.1",
    "tomlkit>=0.13.3",
    "guessit>=4.2.1",
    "autoqpf>=0.2.4",
    "lxml>=5.3.2",
    "iso639-lang>=2.6.3",
    "unidecode>=1.4.0",
    "shortuuid>=1.0.13",
    "torf>=4.3.0",
    "pillow>=12.3.0",
    "platformdirs>=4.11.3",
    "pyside6-essentials==6.11.1",
    "psutil>=7.2.0",
    "pyimgbox>=1.0.7",
    "aiohttp>=3.13.3",
    "semver>=3.0.4",
    "pyotp>=2.9.0",
    "qbittorrent-api>=2025.11.1",
    "bencode-py>=4.0.0",
    "transmission-rpc>=7.0.11",
    "deluge-web-client>=2.0.3",
    "niquests[speedups]>=3.20.1",
    "regex>=2025.11.3",
    "stdlib-list>=0.12.0",
    "jinja2>=3.1.6",
    "beautifulsoup4>=4.13.4",
    "rapidfuzz>=3.14.3",
    "qtawesome>=1.4.0",
    "urllib3>=2.7.0",
    "tenacity>=9.1.4",
    "python-dotenv>=1.2.2",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "basedpyright",
    "ruff>=0.16.2",
    "cython>=3.0.12",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "setuptools>=78.1.1",
    "debugpy",
    "types-psutil",
    "poethepoet>=0.48.0",
]
build = [
    "pyinstaller-hooks-contrib>=2025.1",
    "pyinstaller>=6.9.0",
    # PyInstaller's altgraph dependency does an unconditional `import
    # pkg_resources` at import time; uv-managed venvs don't seed
    # setuptools/pip by default (unlike stdlib venv), so this must be an
    # explicit build-extra dependency, not just a dev one. Capped below 82
    # because setuptools removed pkg_resources entirely starting at 82.0.0
    # (confirmed: 81.0.0 still ships it, 82.0.0 does not) - drop the cap
    # once altgraph/pyinstaller stop depending on it upstream.
    "setuptools>=78.1.1,<82",
]
docs = ["mkdocs>=1.6.1", "mkdocs-material>=9.6.11", "pymdown-extensions"]

[tool.ruff]
line-length = 88
include = [
    "pyproject.toml",
    "src/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
    "typings/**/*.py",
]

[tool.uv]
constraint-dependencies = ["requests>=2.32.4"]

[tool.ruff.lint]
# `select` replaces ruff's defaults rather than extending them, so "F"
# (pyflakes) has to be listed explicitly or unused imports, redefinitions,
# undefined names, and unused locals go un-linted.
select = ["F", "I", "UP", "B", "S", "RUF100"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# pytest is built on `assert`; S101 in tests is not a finding.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
# The slowest test in the suite runs in ~2s, so this only ever fires on
# something genuinely stuck. It is here because a blocked test does not fail,
# it stalls the entire run with no output and nothing naming the test
# responsible -- an accidental modal dialog cost 30+ minutes of a runner
# exactly that way. `tests/conftest.py` refuses modals outright; this catches
# whatever else can wedge (a thread that never finishes, a nested event loop
# with no quit).
timeout = 60
# "thread" rather than the signal-based default pytest-timeout picks on Unix:
# a Python signal handler only runs between bytecodes, so it cannot interrupt
# a thread parked inside Qt's C++ event loop -- which is the hang most worth
# catching here. It also keeps CI and Windows behaving the same way, since
# Windows has no SIGALRM and would fall back to threads regardless. The
# tradeoff is that a timeout ends the run instead of failing one test, but it
# dumps every thread's stack on the way out, which is what names the culprit.
timeout_method = "thread"

[tool.basedpyright]
include = [
    "src",
    "start_ui.py",
    "build.py",
    "plugins/jinja2_plugin_example",
    "plugins/metadata_plugin_example",
]
typeCheckingMode = "standard"

[tool.poe.tasks]
typecheck = "basedpyright"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format-check = "ruff format . --check"
format-code = "ruff format ."
format.sequence = ["lint-fix", "format-code"]
format-docs = "npm run format:md"
sync-dev = "scripts/sync_dev.py"
